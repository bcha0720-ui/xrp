name: 6-Hour RLUSD Broadcaster

on:
  schedule:
    # Runs at minute 0 past every 6th hour (UTC times: 00:00, 06:00, 12:00, 18:00)
    - cron: '0 */6 * * *'
  
  # Allows you to click a button in GitHub to test run the workflow manually
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install node-fetch

      - name: Run RLUSD Script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/broadcast-rlusd.js
