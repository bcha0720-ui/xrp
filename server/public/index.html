<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0D13">
  <meta name="description" content="XRP Insights — ETF holdings, XRPL exchange balances, and ETF trading volumes.">
  <title>XRP Insights</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%230E121A'/%3E%3Cpath d='M44.7 20h4.5l-9.6 9.3a10.8 10.8 0 01-15.2 0L14.8 20h4.5l7.4 7.1a7.2 7.2 0 0010.6 0L44.7 20zM19.3 44h-4.5l9.6-9.3a10.8 10.8 0 0115.2 0l9.6 9.3h-4.5l-7.4-7.1a7.2 7.2 0 00-10.6 0L19.3 44z' fill='%232DE3CB'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1>XRP Insights</h1>
          <p class="tagline">Holdings · XRPL scan · ETF volume</p>
        </div>
      </div>
      <div class="status-cluster">
        <span id="statusPill" class="pill pill-idle" role="status">Idle</span>
        <button id="retryBtn" class="btn btn-ghost" type="button">Retry</button>
      </div>
    </header>

    <nav class="tabs" role="tablist" aria-label="Main">
      <button class="tab active" role="tab" aria-selected="true" data-tab="overview">Overview</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="holdings">Holdings</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="exchanges">Exchanges</button>
      <button class="tab" role="tab" aria-selected="false" data-tab="etf">ETF Trading</button>
    </nav>

    <main>
      <section id="tab-overview" class="panel active" role="tabpanel"></section>
      <section id="tab-holdings" class="panel" role="tabpanel" hidden></section>
      <section id="tab-exchanges" class="panel" role="tabpanel" hidden></section>
      <section id="tab-etf" class="panel" role="tabpanel" hidden></section>
    </main>

    <footer class="foot">
      Numbers come from live APIs only — Google Sheet (sparse), XRPL account_info, Yahoo Finance.
      Static Render hosting cannot run the exchange scan or ETF proxy.
    </footer>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
